backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Create {{collection}} '{{slug}}'"
    update: "Update {{collection}} '{{slug}}'"

# Media storage
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/home.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "string"}
          - {label: "Dates", name: "dates", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - label: "Appearance"
            name: "appearance"
            widget: "object"
            collapsed: false
            fields:
              - label: "Background Type"
                name: "background_type"
                widget: "select"
                options: ["image", "vimeo"]
                default: "image"
              - {label: "Background Image", name: "background_image", widget: "image", default: "/images/background-image.jpg"}
              - {label: "Vimeo Video URL", name: "vimeo_url", widget: "string"}
              - label: "Header & footer layout"
                name: "header_footer_layout"
                widget: "select"
                options:
                  - { label: "Top Logo", value: "logo_top" }
                  - { label: "Bottom Logo", value: "logo_bottom" }
                default: "logo_top"
          - label: "Tickets"
            name: "ticket_buttons"
            widget: "list"
            fields:
              - {label: "Text", name: "text", widget: "string"}
              - {label: "Link", name: "link", widget: "string"}
              - {label: "Is Sold Out", name: "sold_out", widget: "boolean", default: false}
              - {label: "Target", name: "target", widget: "select", options: ["_blank", "_self"], default: "_blank"}
            summary: "{{fields.text}} {{fields.sold_out | ternary '(Sold Out)' ''}}"
          - label: "Floating Buttons"
            name: "floating_buttons"
            widget: "list"
            fields:
              - {label: "Text", name: "text", widget: "string"}
              - {label: "Link", name: "link", widget: "string"}
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
            summary: "{{fields.text}} {{fields.visible | ternary '' '(Hidden)'}}"
          - label: "Archive"
            name: "archive_videos"
            widget: "list"
            allow_add: true
            collapsed: false
            fields:
              - {label: "Video Number", name: "video_number", widget: "number", default: 1}
              - {label: "Video Title", name: "title", widget: "string"}
              - {label: "Video URL", name: "video_url", widget: "string"}
              - {label: "Is Latest Video", name: "is_latest", widget: "boolean", default: false}
            summary: "{{fields.video_number | default: '?'}} - {{fields.title | default: 'Untitled'}} {{fields.is_latest | ternary '(Latest)' ''}}"
          - label: "Social"
            name: "social"
            widget: "object"
            fields:
              - {label: "Instagram", name: "instagram", widget: "string"}
              - {label: "Facebook", name: "facebook", widget: "string"}
          - label: "Partners"
            name: "partners_section"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Special thanks"}
              - label: "Logos"
                name: "partners"
                widget: "list"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Logo", name: "logo", widget: "image"}
                  - {label: "Link", name: "link", widget: "string"}
                  - {label: "Alt Text", name: "alt", widget: "string"}
                summary: "{{fields.name}}"
          - label: "Accom"
            name: "accom_section"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Accommodation"}
              - {label: "Body", name: "body", widget: "text"}
              - {label: "Email", name: "email", widget: "string", default: "reservations@plymouth.co.nz"}
              - {label: "Email Button Text", name: "email_button_text", widget: "string", default: "Email now"}
              - {label: "Website", name: "website", widget: "string"}

      - name: "seo"
        label: "SEO"
        file: "content/seo.md"
        fields:
          - {label: "SEO Title", name: "seo_title", widget: "string"}
          - {label: "SEO Description", name: "seo_description", widget: "text"}
          - {label: "Event start date (Google)", name: "event_start_date", widget: "string"}
          - {label: "Event end date (Google)", name: "event_end_date", widget: "string"}

      - name: "about"
        label: "About"
        file: "content/about.md"
        fields:
          - {label: "Page Title", name: "page_title", widget: "string", default: "About & FAQ"}
          - label: "Navigation"
            name: "navigation"
            widget: "list"
            fields:
              - {label: "Number", name: "number", widget: "string", hint: "e.g., 01, 02, 03"}
              - {label: "Label", name: "label", widget: "string", hint: "e.g., Darklight, FAQ, About Us"}
              - {label: "Section ID", name: "section_id", widget: "string", hint: "e.g., about-darklight, faq, about-us"}
              - {label: "Visible", name: "visible", widget: "boolean", default: true, hint: "Show this section in navigation and on page"}
            summary: "{{fields.number}} {{fields.label}} {{fields.visible | ternary '' '(Hidden)'}}"
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - {label: "Section ID", name: "section_id", widget: "string", hint: "Must match navigation section_id"}
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Visible", name: "visible", widget: "boolean", default: true, hint: "Show this section on the page"}
              - label: "Content Type"
                name: "content_type"
                widget: "select"
                options: ["text", "faq", "about_us"]
                default: "text"
              - label: "Content"
                name: "content"
                widget: "markdown"
                required: false
              - label: "FAQ Items"
                name: "faq_items"
                widget: "list"
                required: false
                fields:
                  - {label: "Question", name: "question", widget: "string"}
                  - {label: "Answer", name: "answer", widget: "markdown"}
                summary: "{{fields.question}}"
              - label: "About Us Items"
                name: "about_us_items"
                widget: "list"
                required: false
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown"}
                summary: "{{fields.name}}"
            summary: "{{fields.title}} ({{fields.content_type}}) {{fields.visible | ternary '' '(Hidden)'}}"

      - name: "about_resonate"
        label: "Resonate"
        file: "content/about-resonate.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Main Content", name: "content", widget: "markdown"}
          - label: "Performers"
            name: "performers"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "markdown"}
            summary: "{{fields.name}}"

      - name: "gallery"
        label: "Gallery"
        file: content/gallery.md
        fields:
          - { name: title, label: Gallery Title, widget: string }
          - label: Images
            name: images
            widget: list
            fields:
              - { name: url, label: Image, widget: image }
              - { name: caption, label: Caption, widget: string, required: false }

      - name: "installation"
        label: "Installation"
        file: "content/installation.md"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "Installation"}
          - {label: "Image", name: "image", widget: "image", default: "/images/map.svg"}
          - {label: "Visible", name: "visible", widget: "boolean", default: true, hint: "Show this page"}
          - label: "Artworks"
            name: "artworks"
            widget: "list"
            fields:
              - {label: "Number", name: "number", widget: "string", hint: "e.g., 1, 2, 3"}
              - {label: "Name", name: "name", widget: "string", hint: "e.g., SIGNAL, LUMINOUS WAVES"}
              - {label: "Content", name: "content", widget: "markdown", hint: "Include artist, sound designer, and bio information all in one field"}
            summary: "{{fields.number}} - {{fields.name}}"
